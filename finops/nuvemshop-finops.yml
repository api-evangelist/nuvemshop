description: >-
  FinOps view of Nuvemshop / Tiendanube spend. There are two distinct cost
  perspectives. (1) MERCHANT side: a store pays a monthly SaaS subscription
  (varying by country and plan tier) plus a per-sale fee on non-native payment
  methods (reduced or waived when using the native Nuvem Pago gateway); the
  Admin API is included in the subscription and is not separately metered by
  call volume. (2) APP DEVELOPER / PARTNER side: building on and calling the API
  is free; developers monetize apps through the App Store and Nuvemshop takes a
  revenue share on app charges, billed through the platform's billing system.
  Exact subscription prices, per-sale percentages by market, and revenue-share
  rates are NOT reconciled in this artifact.
notes: >-
  This is a SaaS + marketplace-revenue-share model, not a usage-metered API. No
  per-API-call charge exists. Subscription amounts and revenue-share
  percentages change and differ by country (BR/AR/MX/CL/CO); verify on the
  provider pricing and Partner pages during reconciliation.
