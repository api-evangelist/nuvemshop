aid: nuvemshop
name: Nuvemshop / Tiendanube
review:
  question: Does Nuvemshop expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Nuvemshop / Tiendanube's public API is a
    request/response REST Admin API over HTTPS. Its only server-push mechanism
    is webhooks - the platform POSTs event notifications (order/created,
    product/updated, etc.) to an HTTPS callback URL the app registers. Webhooks
    are server-to-endpoint HTTP callbacks, not a WebSocket or SSE transport, so
    there is no bidirectional/streaming socket surface to model. No documented
    wss:// endpoint exists.
findings:
  summary: |
    Nuvemshop (Tiendanube) does not publish a documented public WebSocket API.
    The platform exposes a store-scoped REST Admin API under
    https://api.tiendanube.com/2025-03/{store_id} (and the Brazil mirror
    https://api.nuvemshop.com.br/2025-03/{store_id}; the legacy
    https://api.tiendanube.com/v1/{store_id} path remains available). Apps
    authenticate with OAuth 2 (authorization code grant) and send the resulting
    non-expiring access token in a NON-STANDARD header - `Authentication: bearer
    ACCESS_TOKEN` (header name is `Authentication`, not `Authorization`, and
    `bearer` must be lowercase) - plus a required descriptive `User-Agent`
    header. Event delivery is via registered webhooks (HTTP POST callbacks), not
    a socket. No realtime, bidirectional, or streaming WebSocket (ws:// or
    wss://) endpoint is documented anywhere in the API reference.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.tiendanube.com/2025-03/{store_id}
      documented: true
      note: >-
        Store-scoped Admin API. Brazil mirror api.nuvemshop.com.br; legacy
        /v1/{store_id} path still supported.
    - protocol: Webhook
      scheme: https
      documented: true
      note: >-
        The platform POSTs event notifications (e.g. order/created,
        product/updated, customer/created) to a registered HTTPS URL.
        Server-to-endpoint HTTP callback, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: >-
        No WebSocket endpoint is documented in the Nuvemshop / Tiendanube API
        reference as of the review date.
  authNote: >-
    Non-standard auth header confirmed in the live docs: the header MUST be
    named `Authentication` (using `Authorization` returns 401) and the `bearer`
    prefix MUST be lowercase. A `User-Agent` header identifying the app and a
    contact is required or the API returns 400.
  rateLimitNote: >-
    Per-store leaky bucket: default 40-request bucket draining at 2 req/s;
    higher plan tiers (Next / Evolution) get 10x. Overflow returns 429 with
    x-rate-limit-limit / x-rate-limit-remaining / x-rate-limit-reset headers.
