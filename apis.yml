aid: nuvemshop
url: https://raw.githubusercontent.com/api-evangelist/nuvemshop/refs/heads/main/apis.yml
name: Nuvemshop / Tiendanube
kind: company
description: Nuvemshop (Tiendanube in Spanish-speaking markets) is the leading Latin
  American e-commerce platform, powering online stores for merchants across Brazil,
  Argentina, Mexico, Chile, and Colombia. Its public REST Admin API lets apps and
  integrations manage products, variants, images, categories, orders, customers,
  coupons, scripts, webhooks, and store settings on a per-store basis. Apps
  authenticate with OAuth 2 (authorization code grant) and pass a non-expiring
  access token in a non-standard `Authentication` header (lowercase bearer
  prefix) along with a required `User-Agent`. The API is store-scoped - every
  path is prefixed with the
  store id - and is rate limited with a per-store leaky bucket.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/nuvemshop.png
tags:
- E-commerce
- Online Store
- Latin America
- Brazil
- Argentina
- Storefront
- Products
