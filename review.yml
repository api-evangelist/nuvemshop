  modeledOrUnverified:
    - note: >-
        Endpoint paths, HTTP methods, the OAuth 2 flow, the non-standard
        Authentication header, the User-Agent requirement, and the leaky-bucket
        rate limits are all grounded in the live documentation
        (tiendanube.github.io/api-documentation). The request/response BODY
        schemas in openapi/nuvemshop-openapi.yml are simplified representative
        models (additionalProperties:true), not the provider's full field-level
        schema.
    - note: >-
        The platform documents many more resources not modeled here (Cart,
        Draft Order, Fulfillment Order, Transaction, Abandoned Checkout,
        Checkout, Discount, Location, Shipping Carrier, Payment Provider,
        Payment Option, Metafields, Blog, Pages, Email Templates, Business
        Rules, Kit, Billing, and custom fields). This entry captures a solid
        representative subset (10 resources).
    - note: >-
        Merchant subscription prices and app-developer revenue-share
        percentages are not reconciled (plans/finops marked reconciled:false);
        per-sale fee percentages are grounded to the Brazil plan lineup and vary
        by country.
