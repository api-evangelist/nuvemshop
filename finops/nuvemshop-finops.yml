meters:
- name: store_subscription
  description: Monthly per-store SaaS subscription, varying by plan tier and country.
  unit: months
  aggregation: sum
  dimensions:
  - store
  - plan
  - country
- name: per_sale_fee
  description: Percentage-of-sale fee charged on non-native payment methods (reduced/waived with Nuvem Pago); varies by plan.
  unit: gmv_percentage
  aggregation: sum
  dimensions:
  - store
  - plan
  - payment_method
- name: app_revenue_share
  description: Revenue share Nuvemshop takes on App Store app charges (developer/partner side).
  unit: revenue_share
  aggregation: sum
  dimensions:
  - app
  - partner
- name: api_calls
  description: Admin API calls - NOT billed; included with the store subscription and only rate limited per store.
  unit: requests
  aggregation: sum
  dimensions:
  - store
  - app
principles:
- name: Visibility
  description: Track each store's plan subscription and per-sale fees; for app developers, track App Store revenue net of Nuvemshop's revenue share. API calls are free but rate limited, so monitor 429s rather than cost.
- name: Allocation
  description: Map subscriptions and per-sale fees to the owning store/brand; map app revenue share to the specific app and partner account.
- name: Optimization
  description: Use the native Nuvem Pago gateway to cut or waive per-sale fees; pick the plan tier whose per-sale fee and features match store GMV; batch and pace API calls to stay within the per-store leaky bucket instead of paying for higher tiers solely for rate limits.
- name: Accountability
  description: Assign an owner per store subscription and per published app; review plan fit and revenue share monthly against sales volume.
