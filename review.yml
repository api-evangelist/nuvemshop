actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. The public API is request/response
    REST with webhook (HTTP callback) event delivery. No AsyncAPI document was
    created because there is no server-push socket transport (WebSocket or SSE)
    on Nuvemshop's own API to model.
